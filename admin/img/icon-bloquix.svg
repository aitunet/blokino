<svg xmlns="http://www.w3.org/2000/svg" viewBox="43 42 174 174" width="24" height="24" role="img" aria-label="BloqUIX">
	<!--
		Marca de BloqUIX: "tC · corte" (elegida 2026-09-14).

		La t del logo cortada por una diagonal paralela al bisel del asta. La parte de
		arriba a la izquierda (asta, brazo izquierdo, medio cruce) es la t; la de abajo a
		la derecha (brazo derecho, medio cruce, palo, gancho) es la C que la letra ya
		contenía. El hueco entre las dos es VACÍO (desplazamiento ±4,5 de la diagonal y
		recorte de cada forma; sin línea encima, sin trazos): se ve lo que hay detrás.

		Espacio de la letra (bbox 66–194 × 42–216). En wp-admin el motor pinta las dos
		partes con máscaras CSS: la t siempre blanca, la C blanca y Signal (#00BBDB) al
		pasar el ratón o con la pantalla activa. Fuente única de la geometría:
		wporg-assets/build-icon.mjs.
	-->
	<path id="t" d="M104 60 L154 42 V86.1 L97 134 H66 V92 H104 Z" fill="currentColor"/>
	<path id="c" d="M161 92 H190 V134 H154 V160 C154 176 164 182 180 182 H194 V216 H168 C126 216 104 194 104 158 V139.9 Z" fill="currentColor"/>
</svg>
