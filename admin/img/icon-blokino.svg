<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 56 144 144" width="24" height="24" role="img" aria-label="Blokino">
	<!--
		Marca de Blokino: "Encaje volteado · 2 bloques" (elegida 2026-09-23).

		Un bloque cortado en tres piezas con huecos de 9: la b (asta + vientre cuadrado) y
		los dos bloques que la encajan hasta formar el cuadrado (barra de arriba y columna
		de la derecha). Esquinas salientes r6; la esquina interior de la b, recta.

		En wp-admin el motor pinta las partes con máscaras CSS: la b siempre blanca, los
		bloques blancos y Signal (#00BBDB) al pasar el ratón o con la pantalla activa.
		Fuente única de la geometría: wporg-assets/build-icon.mjs.
	-->
