<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Tunet Core">
	<!--
		Marca de Tunet Core: el núcleo con la T en contraforma.

		Dice las dos cosas del nombre a la vez — la T de Tunet y el núcleo de "Core",
		que es lo que el plugin es: el motor compartido por todos los themes.

		POR QUÉ MACIZA, saliéndose del estilo de trazo de los 78 iconos de
		blocks/icon/icons.php: esos son iconos de CONTENIDO para el front y deben
		heredar peso del texto que los rodea. Esto es una MARCA, y hace otro trabajo.
		Ser macizo es justo lo que la hace leer como logo y no como un glifo más de
		interfaz. Se probaron las alternativas de trazo (T con nodo en la unión, T
		dentro de un círculo, punto con órbita, T pelada) renderizadas a 20px, que es
		el tamaño del menú del admin: a ese tamaño el trazo fino pierde —la T con nodo
		parece un alfiler, y WordPress ya usa un alfiler para Entradas— mientras la
		masa sólida con la contraforma aguanta. Decidido mirándolo, no calculándolo.

		El radio (5 sobre 24) conversa con el lenguaje --tnt-radius-* de los themes.

		COLOR: currentColor a propósito, NO el cian de marca (#00bbdc). Medido contra
		los 9 esquemas de color del admin: el cian falla el 3.0 de WCAG 1.4.11 sobre
		el ítem activo en los NUEVE (WordPress lo pinta con su propio azul: 2.25 en el
		esquema por defecto) y falla también sobre el fondo del menú en 4 de 9 (Light
		1.82, Blue 1.12, Ocean 1.51, Sunrise 1.95). El cian va donde controlamos el
		fondo: pantallas del plugin, docs, portada de la guía, icono de wp.org.
	-->
	<path fill-rule="evenodd" fill="currentColor" d="M7.5 2.5h9a5 5 0 0 1 5 5v9a5 5 0 0 1-5 5h-9a5 5 0 0 1-5-5v-9a5 5 0 0 1 5-5zM6.8 6.6h10.4v3.3h-3.6v8.7h-3.2V9.9H6.8z"/>
</svg>
